# Configuration TUI Manager - Ranger
set column_ratios 1,3,5
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp|tmp)$|^lost\+found$|^__(py)?cache__$
set show_hidden true
set preview_files true
set preview_directories true
set preview_images true
set preview_script ~/.config/ranger/scope_advanced.sh
set use_preview_script true
set preview_images_method w3m
set w3m_delay 0.02
set colorscheme catppuccin_mocha

# Raccourcis personnalisés
map <C-f> fzf_select
map <C-r> fzf_locate
map <C-g> fzf_rg_content
map <C-t> tab_new %d
map <C-w> tab_close
map <C-n> console mkdir%space
map <C-x> shell mv %s ~/.local/share/Trash/files/
map <A-d> shell du -sh %s
map yp shell echo -n %d/%f | xclip -selection clipboard
map yn shell echo -n %f | xclip -selection clipboard

# Bindings pour preview
map zi toggle_option preview_images
map zp toggle_option preview_files
map zd toggle_option preview_directories
