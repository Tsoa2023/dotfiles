# ==============================================
# RANGER CONFIGURATION - HYPRLAND STYLE
# ==============================================

# Interface et apparence
set viewmode miller
set column_ratios 1,3,4
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$
set show_hidden false
set confirm_on_delete multiple
set preview_script ~/.config/ranger/scope.sh
set use_preview_script true
set automatically_count_files true
set open_all_images true
set vcs_aware false
set vcs_backend_git enabled
set vcs_backend_hg disabled
set vcs_backend_bzr disabled
set vcs_backend_svn disabled
set preview_images true
set preview_images_method w3m
set w3m_delay 0.02
set unicode_ellipsis false
set show_cursor false
set sort natural
set sort_reverse false
set sort_case_insensitive true
set sort_directories_first true
set xterm_alt_key false

# Thème Hyprland
set colorscheme hyprland

# Padding et marges pour un look épuré
set padding_right true
set autosave_bookmarks false
set save_backtick_bookmark true
set autoupdate_cumulative_size false
set show_selection_in_titlebar true
set max_history_size 20
set max_console_history_size 50

# ==============================================
# RACCOURCIS CLAVIER PERSONNALISÉS
# ==============================================

# Navigation améliorée
map <C-h> move left=1
map <C-j> move down=1
map <C-k> move up=1
map <C-l> move right=1

# Fichiers cachés (toggle)
map zh set show_hidden!

# Barre latérale (toggle)
map S toggle_option show_tree
map <C-t> set show_tree!

# Recherche et sélection
map sf console scout -ftsea%space
map sr shell rg --color=always --line-number --no-heading --smart-case . | fzf --ansi --multi --preview 'echo {}' --preview-window=right:50% | cut -d: -f1,2 | head -1 | xargs -r nvim +$(echo {} | cut -d: -f2) $(echo {} | cut -d: -f1)
map <C-f> fzf_select

# Menu contextuel
map m console shell -f 

# Actions rapides
map cp shell echo -n %d/%f | xclip -selection clipboard
map mz shell tar -czf %f.tar.gz %s
map mx shell chmod +x %s
map md console mkdir%space
map mk console touch%space

# Ouverture intelligente
map <Enter> move right=1
map l move right=1
map <Right> move right=1
map <C-Enter> shell xdg-open %f &

# Prévisualisation améliorée
map <Space> mark_files toggle=True
map v mark_files all=True toggle=True
map uv mark_files all=True val=False
map V toggle_visual_mode

# Navigation par onglets
map <C-n> tab_new
map <C-w> tab_close
map <TAB> tab_move 1
map <S-TAB> tab_move -1

# Bookmarks rapides
map gb cd ~/
map gd cd ~/Downloads
map gc cd ~/.config
map gp cd ~/Pictures
map gv cd ~/Videos
map gm cd ~/Music
map gt cd ~/.trash

# Renommage batch avec vimv
map R shell vimv %s

# Tri rapide
map sn set sort=natural
map ss set sort=size
map st set sort=mtime
map sc set sort=ctime
map se set sort=extension
map sr set sort_reverse!

# ==============================================
# COMMANDES PERSONNALISÉES
# ==============================================

# Création de dossiers avec structure
alias mkcd mkdir -p %s && cd %s

# Compression intelligente
alias compress shell case %f in *.tar.bz2) tar -xjf %f ;; *.tar.gz) tar -xzf %f ;; *.bz2) bunzip2 %f ;; *.rar) unrar x %f ;; *.gz) gunzip %f ;; *.tar) tar -xf %f ;; *.tbz2) tar -xjf %f ;; *.tgz) tar -xzf %f ;; *.zip) unzip %f ;; *.Z) uncompress %f ;; *.7z) 7z x %f ;; *) echo "'%f' cannot be extracted" ;; esac

# Statistiques du dossier
map i shell echo "$(find . -type f | wc -l) files, $(find . -type d | wc -l) directories, $(du -sh . | cut -f1) total"

# ==============================================
# SETTINGS POUR PERFORMANCE
# ==============================================

set idle_delay 2000
set metadata_deep_search false
set preview_max_size 0
set show_cursor false
